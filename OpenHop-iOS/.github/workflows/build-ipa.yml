name: Build OpenHop IPA

on:
  push:
    branches: [openhop-ios]
    paths:
      - "OpenHop-iOS/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: OpenHop-iOS
        run: xcodegen generate
      - name: Build unsigned iOS app
        working-directory: OpenHop-iOS
        run: |
          xcodebuild \
            -project OpenHop.xcodeproj \
            -scheme OpenHop \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package unsigned IPA
        working-directory: OpenHop-iOS
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/OpenHop.app"
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry OpenHop-unsigned.ipa Payload
          unzip -t OpenHop-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: OpenHop-unsigned-IPA
          path: OpenHop-iOS/OpenHop-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
