name: OpenHop
options:
  bundleIdPrefix: com.mirokkk0
  deploymentTarget:
    iOS: "16.0"
targets:
  OpenHop:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mirokkk0.openhopios
        PRODUCT_NAME: OpenHop
        INFOPLIST_KEY_CFBundleDisplayName: OpenHop
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
