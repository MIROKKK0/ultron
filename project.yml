name: ULTRON
options:
  deploymentTarget:
    iOS: "16.0"
targets:
  ULTRON:
    type: application
    platform: iOS
    sources:
      - path: ios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ultron.assistant
        PRODUCT_NAME: ULTRON
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ULTRON
