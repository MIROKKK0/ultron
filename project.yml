name: ULTRON
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  SwiftLlama:
    path: vendor/swift-llama-cpp
targets:
  ULTRON:
    type: application
    platform: iOS
    sources:
      - path: ios
    dependencies:
      - package: SwiftLlama
        product: SwiftLlama
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ultron.assistant
        PRODUCT_NAME: ULTRON
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ULTRON
