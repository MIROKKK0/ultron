name: ULTRON isolated REA + Ghidra analysis

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: ULTRON analysis job identifier
        required: true
        type: string
  push:
    branches:
      - feat/rea-reverse-engineering-integration
    paths:
      - ".github/workflows/reverse-engineering-worker.yml"
      - "backend/reverse_engineering.py"
      - "scripts/rea-site-session.mjs"
      - "scripts/extract-ipa-for-ghidra.py"
      - "scripts/summarize-analysis.py"
  pull_request:
    paths:
      - ".github/workflows/reverse-engineering-worker.yml"
      - "backend/reverse_engineering.py"
      - "scripts/rea-site-session.mjs"
      - "scripts/extract-ipa-for-ghidra.py"
      - "scripts/summarize-analysis.py"

permissions:
  contents: read

concurrency:
  group: ultron-rea-analysis-${{ github.event.inputs.job_id || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
      - name: Validate worker source
        run: |
          python -m py_compile backend/reverse_engineering.py scripts/extract-ipa-for-ghidra.py scripts/summarize-analysis.py
          node --check scripts/rea-site-session.mjs

  analyze:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"

      - name: Prepare workspace
        run: mkdir -p reports work

      - name: Fetch private job payload from ULTRON
        env:
          JOB_ID: ${{ inputs.job_id }}
          CALLBACK_URL: ${{ secrets.ULTRON_WORKER_CALLBACK_URL }}
          WORKER_TOKEN: ${{ secrets.ULTRON_WORKER_CALLBACK_TOKEN }}
        run: |
          test -n "$CALLBACK_URL"
          test -n "$WORKER_TOKEN"
          curl --fail --silent --show-error --max-time 30 \
            -H "X-ULTRON-Worker-Token: $WORKER_TOKEN" \
            "$CALLBACK_URL/internal/reverse-engineering/jobs/$JOB_ID/payload" \
            -o job.json
          python - <<'PY'
          import json
          j=json.load(open("job.json"))
          assert j["target_type"] in ("site", "ipa")
          if j["target_type"] == "site":
              assert j.get("target_url", "").startswith("https://")
          else:
              assert j.get("file_id") and j.get("rea_bridge_url", "").startswith("https://")
          print("Worker job accepted:", j["target_type"])
          PY

      - name: Determine target type
        id: job_type
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          print("target_type=" + json.load(open("job.json"))["target_type"])
          PY

      - name: Install REA CLI
        run: npm install --global rea-agents@6.10.1

      - name: Install isolated Chromium
        if: ${{ steps.job_type.outputs.target_type == 'site' }}
        run: |
          npm install --no-save --no-package-lock playwright@1.64.1
          npx playwright install --with-deps chromium

      - name: Run isolated browser + REA CDP analysis
        if: ${{ steps.job_type.outputs.target_type == 'site' }}
        env:
          JOB_FILE: job.json
        run: node scripts/rea-site-session.mjs

      - name: Install Java and Ghidra
        if: ${{ steps.job_type.outputs.target_type == 'ipa' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download and verify Ghidra 12.1.4
        if: ${{ steps.job_type.outputs.target_type == 'ipa' }}
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip" \
            -o "$RUNNER_TEMP/ghidra.zip"
          echo "ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db  $RUNNER_TEMP/ghidra.zip" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/ghidra"
          unzip -q "$RUNNER_TEMP/ghidra.zip" -d "$RUNNER_TEMP/ghidra"
          echo "GHIDRA_INSTALL_DIR=$RUNNER_TEMP/ghidra/ghidra_12.1.4_PUBLIC" >> "$GITHUB_ENV"
          echo "GHIDRA_HEADLESS_MAXMEM=3G" >> "$GITHUB_ENV"
          echo "REA_GHIDRA_STARTUP_TIMEOUT_MS=1200000" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y procps file

      - name: Download IPA from authenticated REA bridge
        if: ${{ steps.job_type.outputs.target_type == 'ipa' }}
        env:
          REA_BRIDGE_TOKEN: ${{ secrets.REA_BRIDGE_TOKEN }}
        run: |
          test -n "$REA_BRIDGE_TOKEN"
          python - <<'PY'
          import json, os
          j=json.load(open("job.json"))
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write("REA_BRIDGE_URL=" + j["rea_bridge_url"] + "\n")
              f.write("REA_UPLOAD_ID=" + j["file_id"] + "\n")
          PY
          curl --fail --silent --show-error --location --max-time 600 \
            -H "Authorization: Bearer $REA_BRIDGE_TOKEN" \
            "$REA_BRIDGE_URL/api/uploads/$REA_UPLOAD_ID" \
            -o "$RUNNER_TEMP/target.ipa"
          test -s "$RUNNER_TEMP/target.ipa"
          unzip -t "$RUNNER_TEMP/target.ipa" >/dev/null

      - name: Extract app bundle and Mach-O targets
        if: ${{ steps.job_type.outputs.target_type == 'ipa' }}
        run: python scripts/extract-ipa-for-ghidra.py "$RUNNER_TEMP/target.ipa" work

      - name: Verify REA Ghidra provider
        if: ${{ steps.job_type.outputs.target_type == 'ipa' }}
        run: rea doctor --provider ghidra --json > reports/ghidra-doctor.json

      - name: Analyze main iOS executable with REA + Ghidra
        if: ${{ steps.job_type.outputs.target_type == 'ipa' }}
        run: |
          binary="$(python -c 'import json; print(json.load(open("work/ipa-manifest.json"))["main"]["executable"])')"
          timeout 1800 rea inspect "$binary" --provider ghidra --json > reports/ghidra-main.json

      - name: Analyze bundled dynamic libraries
        if: ${{ steps.job_type.outputs.target_type == 'ipa' }}
        continue-on-error: true
        run: |
          index=0
          while IFS= read -r binary; do
            index=$((index + 1))
            timeout 1200 rea inspect "$binary" --provider ghidra --json > "reports/ghidra-library-$index.json" || echo "Library analysis incomplete: $binary" >> reports/limitations.txt
          done < <(python -c 'import json; [print(x) for x in json.load(open("work/ipa-manifest.json"))["libraries"]]')

      - name: Create ULTRON evidence summary
        if: always()
        env:
          TARGET_TYPE: ${{ steps.job_type.outputs.target_type || 'unknown' }}
        run: |
          python scripts/summarize-analysis.py || true
          if [ ! -f reports/summary.txt ]; then
            printf "Worker ended before evidence summary could be generated.\n" > reports/summary.txt
          fi

      - name: Upload full evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ultron-rea-evidence-${{ inputs.job_id }}
          path: |
            reports/
            work/ipa-manifest.json
          retention-days: 14
          if-no-files-found: warn

      - name: Return result to ULTRON
        if: always()
        env:
          JOB_ID: ${{ inputs.job_id }}
          CALLBACK_URL: ${{ secrets.ULTRON_WORKER_CALLBACK_URL }}
          WORKER_TOKEN: ${{ secrets.ULTRON_WORKER_CALLBACK_TOKEN }}
          WORKER_STATUS: ${{ job.status == 'success' && 'succeeded' || 'failed' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os
          summary = open("reports/summary.txt", errors="replace").read()[:55000] if os.path.exists("reports/summary.txt") else ""
          payload = {
              "status": os.environ["WORKER_STATUS"],
              "result_summary": summary,
              "artifact_name": "ultron-rea-evidence-" + os.environ["JOB_ID"],
              "run_url": os.environ["RUN_URL"],
              "error": "" if os.environ["WORKER_STATUS"] == "succeeded" else "Worker terminou com falha; consulte os logs e as limitações no artefato."
          }
          json.dump(payload, open("reports/callback.json", "w"), ensure_ascii=False)
          PY
          curl --fail --silent --show-error --max-time 30 \
            -X POST \
            -H "X-ULTRON-Worker-Token: $WORKER_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @reports/callback.json \
            "$CALLBACK_URL/internal/reverse-engineering/jobs/$JOB_ID/complete"
