name: ULTRON isolated REA + Ghidra analysis

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: ULTRON analysis job identifier
        required: true
        type: string
  push:
    branches:
      - feat/rea-reverse-engineering-integration
    paths:
      - ".github/workflows/reverse-engineering-worker.yml"
      - "backend/reverse_engineering.py"
      - "scripts/rea-site-session.mjs"
      - "scripts/extract-ipa-for-ghidra.py"
      - "scripts/summarize-analysis.py"
      - "scripts/rea-ghidra-session.mjs"
  pull_request:
    paths:
      - ".github/workflows/reverse-engineering-worker.yml"
      - "backend/reverse_engineering.py"
      - "scripts/rea-site-session.mjs"
      - "scripts/extract-ipa-for-ghidra.py"
      - "scripts/summarize-analysis.py"

permissions:
  contents: read

concurrency:
  group: ultron-rea-analysis-${{ github.event.inputs.job_id || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
      - name: Validate worker source
        run: |
          if [ -f backend/reverse_engineering.py ]; then python -m py_compile backend/reverse_engineering.py; fi
          python -m py_compile scripts/extract-ipa-for-ghidra.py scripts/summarize-analysis.py
          node --check scripts/rea-site-session.mjs
          node --check scripts/rea-ghidra-session.mjs

  site-worker-smoke:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
      - name: Install REA and Playwright
        run: |
          npm install --global rea-agents@6.10.1
          npm install --no-save --no-package-lock playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Exercise real CDP + REA website capture
        run: |
          mkdir -p reports
          printf '{"target_type":"site","target_url":"https://example.com"}' > job.json
          JOB_FILE=job.json node scripts/rea-site-session.mjs
          TARGET_TYPE=site python scripts/summarize-analysis.py
          test -s reports/page-01-inspection.json
          test -s reports/page-01-bundle-analysis.json
          test -s reports/page-01-screenshot.json
          python - <<'PY'
          import json
          report=json.load(open("reports/site-session.json"))
          assert len(report["pagesVisited"]) >= 1
          assert report["pagesVisited"][0]["url"].startswith("https://example.com")
          print("CDP/REA site smoke passed.")
          PY

  native-worker-smoke:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Install native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y procps file clang lld
      - name: Download and verify official Ghidra 12.2
        run: |
          curl --fail --location --retry 3 -H "Accept: application/octet-stream" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/NationalSecurityAgency/ghidra/releases/assets/665189215" \
            -o "$RUNNER_TEMP/ghidra.zip"
          echo "2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67  $RUNNER_TEMP/ghidra.zip" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/ghidra"
          unzip -q "$RUNNER_TEMP/ghidra.zip" -d "$RUNNER_TEMP/ghidra"
          echo "GHIDRA_INSTALL_DIR=$RUNNER_TEMP/ghidra/ghidra_12.2_PUBLIC" >> "$GITHUB_ENV"
          echo "GHIDRA_HEADLESS_MAXMEM=3G" >> "$GITHUB_ENV"
          echo "REA_GHIDRA_STARTUP_TIMEOUT_MS=1200000" >> "$GITHUB_ENV"
      - name: Install REA and MCP SDK
        run: |
          npm install --global rea-agents@6.10.1
          npm install --no-save --no-package-lock @modelcontextprotocol/client@2.3.1
      - name: Build a tiny arm64 Mach-O test target
        run: |
          cat > "$RUNNER_TEMP/fixture.c" <<'C'
          __attribute__((noinline)) int ultron_add(int left, int right) {
              return left + right;
          }
          __attribute__((noinline)) int ultron_calculate(int value) {
              return ultron_add(value, 17) * 3;
          }
          int main(void) {
              return ultron_calculate(25);
          }
          C
          clang -target arm64-apple-macos11 -O0 -fno-inline -c "$RUNNER_TEMP/fixture.c" -o "$RUNNER_TEMP/fixture.o"
          file "$RUNNER_TEMP/fixture.o"
      - name: Verify Ghidra and persistent REA function analysis
        run: |
          mkdir -p reports
          rea doctor --provider ghidra --json > reports/ghidra-doctor.json
          timeout 3600 node scripts/rea-ghidra-session.mjs "$RUNNER_TEMP/fixture.o"
          python - <<'PY'
          import json
          report=json.load(open("reports/ghidra-session-summary.json"))
          assert report["provider"] == "ghidra"
          assert report["procedureCandidates"] > 0
          assert report["functionDossiers"] > 0
          print("REA/Ghidra native smoke passed.")
          PY

  analyze:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"

      - name: Prepare workspace
        run: mkdir -p reports work

      - name: Fetch private job payload from ULTRON
        env:
          JOB_ID: ${{ inputs.job_id }}
          CALLBACK_URL: ${{ secrets.ULTRON_WORKER_CALLBACK_URL }}
          WORKER_TOKEN: ${{ secrets.ULTRON_WORKER_CALLBACK_TOKEN }}
        run: |
          test -n "$CALLBACK_URL"
          test -n "$WORKER_TOKEN"
          curl --fail --silent --show-error --max-time 30 \
            -H "X-ULTRON-Worker-Token: $WORKER_TOKEN" \
            "$CALLBACK_URL/internal/reverse-engineering/jobs/$JOB_ID/payload" \
            -o job.json
          python - <<'PY'
          import json
          j=json.load(open("job.json"))
          assert j["target_type"] in ("site", "ipa")
          if j["target_type"] == "site":
              assert j.get("target_url", "").startswith("https://")
          else:
              assert j.get("file_id") and j.get("rea_bridge_url", "").startswith("https://")
          print("Worker job accepted:", j["target_type"])
          PY

      - name: Determine target type
        id: job_type
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          print("target_type=" + json.load(open("job.json"))["target_type"])
          PY

      - name: Install REA CLI
        run: npm install --global rea-agents@6.10.1

      - name: Install isolated Chromium
        if: ${{ steps.job_type.outputs.target_type == 'site' }}
        run: |
          npm install --no-save --no-package-lock playwright@1.64.1
          npx playwright install --with-deps chromium

      - name: Run isolated browser + REA CDP analysis
        if: ${{ steps.job_type.outputs.target_type == 'site' }}
        env:
          JOB_FILE: job.json
        run: node scripts/rea-site-session.mjs

      - name: Install Java and Ghidra
        if: ${{ steps.job_type.outputs.target_type == 'ipa' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Download and verify official Ghidra 12.2
        if: ${{ steps.job_type.outputs.target_type == 'ipa' }}
        run: |
          curl --fail --location --retry 3 -H "Accept: application/octet-stream" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/NationalSecurityAgency/ghidra/releases/assets/665189215" \
            -o "$RUNNER_TEMP/ghidra.zip"
          echo "2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67  $RUNNER_TEMP/ghidra.zip" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/ghidra"
          unzip -q "$RUNNER_TEMP/ghidra.zip" -d "$RUNNER_TEMP/ghidra"
          echo "GHIDRA_INSTALL_DIR=$RUNNER_TEMP/ghidra/ghidra_12.2_PUBLIC" >> "$GITHUB_ENV"
          echo "GHIDRA_HEADLESS_MAXMEM=3G" >> "$GITHUB_ENV"
          echo "REA_GHIDRA_STARTUP_TIMEOUT_MS=1200000" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y procps file

      - name: Download IPA from authenticated REA bridge
        if: ${{ steps.job_type.outputs.target_type == 'ipa' }}
        env:
          REA_BRIDGE_TOKEN: ${{ secrets.REA_BRIDGE_TOKEN }}
        run: |
          test -n "$REA_BRIDGE_TOKEN"
          python - <<'PY'
          import json, os
          j=json.load(open("job.json"))
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write("REA_BRIDGE_URL=" + j["rea_bridge_url"] + "\n")
              f.write("REA_UPLOAD_ID=" + j["file_id"] + "\n")
          PY
          curl --fail --silent --show-error --location --max-time 600 \
            -H "Authorization: Bearer $REA_BRIDGE_TOKEN" \
            "$REA_BRIDGE_URL/api/uploads/$REA_UPLOAD_ID" \
            -o "$RUNNER_TEMP/target.ipa"
          test -s "$RUNNER_TEMP/target.ipa"
          unzip -t "$RUNNER_TEMP/target.ipa" >/dev/null

      - name: Extract app bundle and Mach-O targets
        if: ${{ steps.job_type.outputs.target_type == 'ipa' }}
        run: python scripts/extract-ipa-for-ghidra.py "$RUNNER_TEMP/target.ipa" work

      - name: Install MCP SDK for persistent REA session
        if: ${{ steps.job_type.outputs.target_type == 'ipa' }}
        run: npm install --no-save --no-package-lock @modelcontextprotocol/client@2.3.1

      - name: Verify REA Ghidra provider
        if: ${{ steps.job_type.outputs.target_type == 'ipa' }}
        run: rea doctor --provider ghidra --json > reports/ghidra-doctor.json

      - name: Run persistent REA MCP + Ghidra analysis
        if: ${{ steps.job_type.outputs.target_type == 'ipa' }}
        run: |
          binary="$(python -c 'import json; print(json.load(open("work/ipa-manifest.json"))["main"]["executable"])')"
          timeout 3600 node scripts/rea-ghidra-session.mjs "$binary"

      - name: Create ULTRON evidence summary
        if: always()
        env:
          TARGET_TYPE: ${{ steps.job_type.outputs.target_type || 'unknown' }}
        run: |
          python scripts/summarize-analysis.py || true
          if [ ! -f reports/summary.txt ]; then
            printf "Worker ended before evidence summary could be generated.\n" > reports/summary.txt
          fi

      - name: Return result to ULTRON
        if: always()
        env:
          JOB_ID: ${{ inputs.job_id }}
          CALLBACK_URL: ${{ secrets.ULTRON_WORKER_CALLBACK_URL }}
          WORKER_TOKEN: ${{ secrets.ULTRON_WORKER_CALLBACK_TOKEN }}
          WORKER_STATUS: ${{ job.status == 'success' && 'succeeded' || 'failed' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os
          summary = open("reports/summary.txt", errors="replace").read()[:55000] if os.path.exists("reports/summary.txt") else ""
          payload = {
              "status": os.environ["WORKER_STATUS"],
              "result_summary": summary,
              "artifact_name": "private-ultron-database-report",
              "run_url": os.environ["RUN_URL"],
              "error": "" if os.environ["WORKER_STATUS"] == "succeeded" else "Worker terminou com falha; consulte o status e os logs técnicos."
          }
          json.dump(payload, open("reports/callback.json", "w"), ensure_ascii=False)
          PY
          curl --fail --silent --show-error --max-time 30 \
            -X POST \
            -H "X-ULTRON-Worker-Token: $WORKER_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @reports/callback.json \
            "$CALLBACK_URL/internal/reverse-engineering/jobs/$JOB_ID/complete"
