name: ULTRON iOS Build

on:
  push:
    branches: ["feat/**", "main"]
    paths:
      - "ios/**"
      - "project.yml"
      - ".github/workflows/ios-build.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "ios/**"
      - "project.yml"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator-build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project ULTRON.xcodeproj \
            -scheme ULTRON \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: ULTRON-iOS-Simulator
          path: build/DerivedData/Build/Products/Debug-iphonesimulator/ULTRON.app
          if-no-files-found: error
          retention-days: 7
