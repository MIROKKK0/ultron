name: ULTRON iOS Build

on:
  push:
    branches: ["main", "feat/mandatory-fly-brain-core", "feat/ultron-core-assistant"]
    paths:
      - "ios/**"
      - "project.yml"
      - ".github/workflows/ios-build.yml"
  pull_request:
    branches: ["main", "feat/ultron-core-assistant"]
    paths:
      - "ios/**"
      - "project.yml"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare-llama-framework:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install framework build tools
        run: brew install cmake
      - name: Clone pinned Swift llama wrapper
        run: |
          git clone --depth 1 https://github.com/pgorzelany/swift-llama-cpp.git vendor/swift-llama-cpp
          test "$(git -C vendor/swift-llama-cpp rev-parse HEAD)" = "c0de205096bc735093a1b73107ca4fe52bf99877"
      - name: Verify and prepare official llama.cpp XCFramework
        run: bash vendor/swift-llama-cpp/Scripts/prepare-apple-framework.sh
      - name: Upload prepared Apple framework
        uses: actions/upload-artifact@v4
        with:
          name: ULTRON-llama-apple-framework
          path: vendor/swift-llama-cpp/Artifacts/llama-b11960.xcframework
          if-no-files-found: error
          retention-days: 1

  simulator-build:
    needs: prepare-llama-framework
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Clone pinned Swift llama wrapper
        run: |
          git clone --depth 1 https://github.com/pgorzelany/swift-llama-cpp.git vendor/swift-llama-cpp
          test "$(git -C vendor/swift-llama-cpp rev-parse HEAD)" = "c0de205096bc735093a1b73107ca4fe52bf99877"
      - name: Download prepared Apple framework
        uses: actions/download-artifact@v4
        with:
          name: ULTRON-llama-apple-framework
          path: vendor/swift-llama-cpp/Artifacts/llama-b11960.xcframework
      - name: Generate red ULTRON app icon
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet cairosvg
          .venv/bin/python scripts/generate_app_icon.py
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project ULTRON.xcodeproj \
            -scheme ULTRON \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: ULTRON-iOS-Simulator
          path: build/DerivedData/Build/Products/Debug-iphonesimulator/ULTRON.app
          if-no-files-found: error
          retention-days: 7

  device-ipa:
    needs: prepare-llama-framework
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Clone pinned Swift llama wrapper
        run: |
          git clone --depth 1 https://github.com/pgorzelany/swift-llama-cpp.git vendor/swift-llama-cpp
          test "$(git -C vendor/swift-llama-cpp rev-parse HEAD)" = "c0de205096bc735093a1b73107ca4fe52bf99877"
      - name: Download prepared Apple framework
        uses: actions/download-artifact@v4
        with:
          name: ULTRON-llama-apple-framework
          path: vendor/swift-llama-cpp/Artifacts/llama-b11960.xcframework
      - name: Generate red ULTRON app icon
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet cairosvg
          .venv/bin/python scripts/generate_app_icon.py
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned app for physical iPhone
        run: |
          xcodebuild \
            -project ULTRON.xcodeproj \
            -scheme ULTRON \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DeviceData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      - name: Package IPA for SideStore signing
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/DeviceData/Build/Products/Release-iphoneos/ULTRON.app build/ipa/Payload/
          cd build/ipa
          /usr/bin/zip -qry ULTRON.ipa Payload
      - name: Upload iPhone IPA
        uses: actions/upload-artifact@v4
        with:
          name: ULTRON-iPhone-IPA
          path: build/ipa/ULTRON.ipa
          if-no-files-found: error
          retention-days: 7
