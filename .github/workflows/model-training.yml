name: ULTRON model training

on:
  workflow_dispatch:
  schedule:
    - cron: "17 14 * * *"
  pull_request:
    branches: ["main", "feat/ultron-core-assistant"]
    paths:
      - "training/**"
      - "scripts/train_intent_model.py"
      - "backend/model/**"
      - "backend/app.py"
      - "backend/generative.py"
      - "backend/web_research.py"
      - "backend/experimental_transformer.py"
      - "tests/**"
      - ".github/workflows/model-training.yml"

permissions:
  contents: read

jobs:
  reproducible-training:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyTorch for experimental language model training
        run: python -m pip install "torch>=2.2,<3.0"
      - name: Train model from ULTRON corpus
        run: python scripts/train_intent_model.py
      - name: Verify deterministic model artifact
        run: python scripts/train_intent_model.py --check
      - name: Install application and test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run complete Python regression suite
        run: python -m unittest discover -v
      - name: Train experimental instruction-tuned Transformer
        run: python -m training.generative.sft --epochs 10 --threads 2 --output artifacts/ultron-tiny-sft.pt
      - name: Upload experimental checkpoint and report
        uses: actions/upload-artifact@v4
        with:
          name: ultron-tiny-sft-experimental
          path: artifacts/ultron-tiny-sft.pt
          retention-days: 14
      - name: Train task-specific ULTRON specialist
        run: python -m training.generative.sft --dataset training/generative/ultron_specialist_v1.jsonl --epochs 15 --threads 2 --output artifacts/ultron-specialist-v1.pt
      - name: Evaluate task-specific specialist on held-out cases
        run: python scripts/evaluate_ultron_specialist.py --checkpoint artifacts/ultron-specialist-v1.pt --output ultron-specialist-eval.json
      - name: Upload task-specific model and evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: ultron-specialist-v1-evaluation
          path: |
            artifacts/ultron-specialist-v1.pt
            ultron-specialist-eval.json
          retention-days: 14
      - name: Benchmark latency and memory
        run: python scripts/benchmark_intent_model.py --iterations 1000 | tee ultron-evolution-report.txt
      - name: Save daily evolution report
        uses: actions/upload-artifact@v4
        with:
          name: ultron-daily-evolution-report
          path: ultron-evolution-report.txt
          retention-days: 14
