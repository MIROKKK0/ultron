name: ULTRON Recursive Self-Evolution

on:
  workflow_dispatch:
    inputs:
      objective:
        description: "Objetivo opcional; vazio deixa o ULTRON escolher a melhoria prioritária"
        required: false
        type: string
        default: ""
  schedule:
    - cron: "23 5 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ultron-recursive-evolution
  cancel-in-progress: false

jobs:
  evolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout development core
        uses: actions/checkout@v4
        with:
          ref: feat/ultron-core-assistant
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Fetch frozen evaluator from default branch
        run: |
          git fetch origin main
          git show origin/main:scripts/agent_eval_frozen.py > /tmp/agent_eval_frozen.py

      - name: Install ULTRON dependencies
        run: pip install -r requirements.txt

      - name: Configure evolution worker identity
        run: |
          git config user.name "ULTRON Evolution Worker"
          git config user.email "ultron-evolution[bot]@users.noreply.github.com"

      - name: Research, inspect project and generate a candidate patch
        env:
          ULTRON_LLM_API_KEY: ${{ secrets.ULTRON_LLM_API_KEY }}
          ULTRON_LLM_BASE_URL: ${{ secrets.ULTRON_LLM_BASE_URL }}
          ULTRON_LLM_MODEL: ${{ secrets.ULTRON_LLM_MODEL }}
          OBJECTIVE: ${{ inputs.objective }}
        run: python scripts/recursive_evolution.py --generate --objective "$OBJECTIVE"

      - name: Run full regression suite
        id: tests
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee /tmp/ultron-tests.log

      - name: Run frozen agent benchmark
        run: ULTRON_SOURCE_ROOT="$GITHUB_WORKSPACE" python /tmp/agent_eval_frozen.py --output /tmp/ultron-agent-evaluation.json

      - name: Prepare private test report for the critic
        run: |
          {
            echo "UNIT TESTS:"
            tail -n 220 /tmp/ultron-tests.log
            echo
            echo "AGENT EVALUATION:"
            cat /tmp/ultron-agent-evaluation.json
          } > /tmp/ultron-test-report.txt

      - name: ULTRON critic reviews the actual patch and test results
        env:
          ULTRON_LLM_API_KEY: ${{ secrets.ULTRON_LLM_API_KEY }}
          ULTRON_LLM_BASE_URL: ${{ secrets.ULTRON_LLM_BASE_URL }}
          ULTRON_LLM_MODEL: ${{ secrets.ULTRON_LLM_MODEL }}
        run: python scripts/recursive_evolution.py --review --test-report /tmp/ultron-test-report.txt

      - name: Create candidate branch and pull request
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          branch="ultron/evolution-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          git add backend ios scripts tests docs skills training
          if git diff --cached --quiet; then
            echo "No candidate changes to commit."
            exit 1
          fi
          git commit -m "evolution: ULTRON autonomous improvement candidate"
          git push origin "$branch"
          pr_url="$(gh pr create \
            --base feat/ultron-core-assistant \
            --head "$branch" \
            --title "ULTRON: autonomous evolution candidate ${GITHUB_RUN_NUMBER}" \
            --body "Generated by ULTRON after public technical research, repository self-inspection, full unit tests, frozen agent evaluation and a separate critic pass. The candidate targets the development core only. Production main and Render deployment are not changed.")"
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Wait for candidate CI and evolution benchmark
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr checks "${{ steps.candidate.outputs.url }}" --watch --fail-fast --interval 15

      - name: Promote only candidates marked eligible by the frozen evolution gate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.candidate.outputs.url }}
        run: |
          labels="$(gh pr view "$PR_URL" --json labels --jq '[.labels[].name] | join(",")')"
          if [[ ",$labels," == *",ultron-eligible-for-promotion,"* ]]; then
            gh pr merge "$PR_URL" --squash --delete-branch
          else
            echo "ULTRON gate did not mark this candidate eligible. PR remains open for human review."
            echo "Current labels: $labels"
          fi

