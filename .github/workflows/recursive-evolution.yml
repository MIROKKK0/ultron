name: ULTRON Recursive Self-Evolution

on:
  workflow_dispatch:
    inputs:
      objective:
        description: "Objetivo opcional; vazio deixa o ULTRON escolher a melhoria prioritária"
        required: false
        type: string
        default: ""
  schedule:
    - cron: "23 5 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ultron-recursive-evolution
  cancel-in-progress: false

jobs:
  evolve:
    if: github.ref_name == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout selected development branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Fetch frozen evaluator and baseline source
        run: |
          git fetch origin main
          git worktree add /tmp/ultron-baseline origin/main
          git show origin/main:scripts/agent_eval_frozen.py > /tmp/agent_eval_frozen.py

      - name: Install ULTRON dependencies
        run: pip install -r requirements.txt

      - name: Configure evolution worker identity
        run: |
          git config user.name "ULTRON Evolution Worker"
          git config user.email "ultron-evolution[bot]@users.noreply.github.com"

      - name: Research, inspect project and generate a candidate patch
        env:
          ULTRON_LLM_API_KEY: ${{ secrets.ULTRON_LLM_API_KEY }}
          ULTRON_LLM_BASE_URL: ${{ secrets.ULTRON_LLM_BASE_URL }}
          ULTRON_LLM_MODEL: ${{ secrets.ULTRON_LLM_MODEL }}
          OBJECTIVE: ${{ inputs.objective }}
        run: python scripts/recursive_evolution.py --generate --objective "$OBJECTIVE"

      - name: Run full regression suite
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee /tmp/ultron-tests.log

      - name: Run frozen candidate and baseline benchmarks
        run: |
          ULTRON_SOURCE_ROOT="$GITHUB_WORKSPACE" python /tmp/agent_eval_frozen.py --output /tmp/ultron-agent-evaluation.json || true
          ULTRON_SOURCE_ROOT="/tmp/ultron-baseline" python /tmp/agent_eval_frozen.py --output /tmp/ultron-baseline-evaluation.json || true

      - name: Prepare test and benchmark report
        run: |
          {
            echo "UNIT TESTS:"
            tail -n 220 /tmp/ultron-tests.log
            echo
            echo "CANDIDATE BENCHMARK:"
            cat /tmp/ultron-agent-evaluation.json
            echo
            echo "BASELINE BENCHMARK:"
            cat /tmp/ultron-baseline-evaluation.json
          } > /tmp/ultron-test-report.txt

      - name: Independent ULTRON critic review
        env:
          ULTRON_LLM_API_KEY: ${{ secrets.ULTRON_LLM_API_KEY }}
          ULTRON_LLM_BASE_URL: ${{ secrets.ULTRON_LLM_BASE_URL }}
          ULTRON_LLM_MODEL: ${{ secrets.ULTRON_LLM_MODEL }}
        run: |
          python scripts/recursive_evolution.py --review \
            --test-report /tmp/ultron-test-report.txt \
            --candidate-eval /tmp/ultron-agent-evaluation.json \
            --baseline-eval /tmp/ultron-baseline-evaluation.json

      - name: Create candidate branch and pull request
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No candidate changes to commit."
            exit 1
          fi
          branch="ultron/evolution-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          git commit -m "evolution: ULTRON autonomous improvement candidate"
          git push origin "$branch"
          pr_url="$(gh pr create \
            --base "main" \
            --head "$branch" \
            --title "ULTRON: autonomous evolution candidate ${GITHUB_RUN_NUMBER}" \
            --body "Candidate generated by ULTRON after public research, repository inspection, full unit tests, frozen baseline comparison and critic review. It remains a pull request for human review; no automatic merge or deployment is performed.")"
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Wait for candidate pull request checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr checks "${{ steps.candidate.outputs.url }}" --watch --fail-fast --interval 15

      - name: Mark eligible candidate for human review
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr edit "${{ steps.candidate.outputs.url }}" --add-label "ultron-eligible-for-review"
