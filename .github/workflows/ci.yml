name: ULTRON CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main", "feat/ultron-core-assistant"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Validate workflow YAML syntax
        run: |
          ruby -e 'require "yaml"; Dir[".github/workflows/*.{yml,yaml}"].sort.each { |file| YAML.load_file(file, aliases: true); puts "valid: #{file}" }'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify reproducible ULTRON model
        run: python scripts/train_intent_model.py --check
      - name: Compile Python modules
        run: python -m compileall -q backend scripts
      - name: Benchmark lightweight intent inference
        run: python scripts/benchmark_intent_model.py --iterations 1000
      - name: Run tests
        run: python -m unittest discover -s tests -v
