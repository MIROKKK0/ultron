databases:
  - name: ultron-db
    plan: free
    region: virginia
    postgresMajorVersion: 18

services:
  - type: web
    name: ultron-api
    runtime: python
    plan: free
    region: virginia
    branch: feat/ultron-core-assistant
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ultron-db
          property: connectionString
      - key: ULTRON_API_TOKEN
        generateValue: true
      - key: GOOGLE_API_KEY
        sync: false
      - key: ULTRON_GEMINI_MODEL
        value: gemini-2.5-flash
