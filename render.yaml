databases:
  - name: ultron-db
    plan: free
    region: virginia
    postgresMajorVersion: 18

services:
  - type: web
    name: ultron-api
    runtime: python
    plan: free
    region: virginia
    branch: feat/ultron-core-assistant
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT --workers 1 --limit-concurrency 20 --timeout-keep-alive 5
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ultron-db
          property: connectionString
      - key: ULTRON_API_TOKEN
        generateValue: true
      - key: REA_BRIDGE_URL
        value: https://rea-bridge-vt6z.onrender.com
      - key: REA_BRIDGE_TOKEN
        sync: false
      - key: ULTRON_GITHUB_TOKEN
        sync: false
      - key: ULTRON_GITHUB_REPOSITORY
        value: MIROKKK0/ultron
      - key: ULTRON_ANALYSIS_REF
        value: main
      - key: ULTRON_WORKER_CALLBACK_TOKEN
        sync: false
      - key: ULTRON_GITHUB_TOKEN
        sync: false
      - key: ULTRON_GITHUB_REPO
        value: MIROKKK0/ultron
      - key: ULTRON_GITHUB_REF
        value: feat/rea-reverse-engineering-integration
